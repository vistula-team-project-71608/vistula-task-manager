<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Contribution</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            text-align: center;
            padding: 60px 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        a {
            display: block;
            margin-top: 25px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Team Contribution</h1>

        <button id="load-contributor">
            Show Contributor
        </button>

        <p id="contributor-student-id"></p>

        <a href="index.html">Back to Task Manager</a>
    </div>

    <script>
        const button = document.getElementById("load-contributor");
        const result = document.getElementById("contributor-student-id");

        button.addEventListener("click", async () => {
            try {
                const response = await fetch("contribution.json");

                if (!response.ok) {
                    throw new Error("Cannot load contributor data");
                }

                const data = await response.json();

                const studentId = data.contributorStudentID || data.contributorStudentId;

                if (studentId) {
                    result.textContent = "Contributor Student ID: " + studentId;
                } else {
                    result.textContent = "Ошибка: ID не найден в файле JSON.";
                }
                
            } catch (error) {
                result.textContent = "Error: " + error.message;
            }
        });
    </script>
</body>
</html>
